<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Spatial Photos</title>
	<style>
		:root { color-scheme: dark; font-family: system-ui, sans-serif; }
		body { margin: 0; overflow: hidden; background: #080808; color: #eeeeee; }
		spatial-photo { position: fixed; inset: 0; width: 100%; height: 100%; --spatial-photo-background: #080808; }
		spatial-photo::part(status) { background: #181818; color: #eeeeee; }
		spatial-photo::part(progress) { accent-color: #bbbbbb; }
		details {
			position: fixed;
			top: 16px;
			left: 16px;
			z-index: 1;
			width: min(280px, calc(100vw - 32px));
			max-height: calc(100dvh - 32px);
			overflow: auto;
			border: 1px solid #ffffff20;
			border-radius: 10px;
			background: #181818;
			box-shadow: 0 8px 32px #00000040;
		}
		summary { padding: 14px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
		.panel { display: grid; gap: 16px; padding: 0 16px 16px; }
		button {
			padding: 9px 12px;
			border: 1px solid #ffffff30;
			border-radius: 6px;
			background: #303030;
			color: inherit;
			font: inherit;
			font-size: 13px;
			cursor: pointer;
		}
		button:hover { background: #3b3b3b; }
		:focus-visible { outline: 2px solid #bbbbbb; outline-offset: 2px; }
		label { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 13px; }
		input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: #bbbbbb; }
		input[type="checkbox"] { margin: 0; accent-color: #bbbbbb; }
		label output { color: #aaaaaa; font-variant-numeric: tabular-nums; }
		p, #status { margin: 0; color: #aaaaaa; font-size: 12px; line-height: 1.5; }
		#status { overflow-wrap: anywhere; }
		.drop-target {
			position: fixed;
			inset: 16px;
			z-index: 2;
			display: grid;
			place-items: center;
			border: 2px dashed #bbbbbb;
			border-radius: 12px;
			background: #181818bb;
			font-size: 20px;
			pointer-events: none;
		}
		[hidden] { display: none; }
	</style>
</head>
<body>
	<spatial-photo id="photo" aria-label="Spatial photo preview"></spatial-photo>
	<details open>
		<summary>Spatial Photos</summary>
		<div class="panel">
			<button id="open" type="button">Open Spatial</button>
			<input id="file" type="file" accept=".spatial" hidden>
			<label for="cover">
				Cover framing <input id="cover" type="checkbox">
			</label>
			<label for="sensitivity">
				Sensitivity <output id="sensitivity-value">0.075</output>
				<input id="sensitivity" type="range" min="0" max="0.3" step="0.005" value="0.075">
			</label>
			<label for="snappiness">
				Snappiness <output id="snappiness-value">5.5</output>
				<input id="snappiness" type="range" min="1" max="10" step="0.1" value="5.5">
			</label>
			<p>Move the pointer to look around, or tap and drag on touch screens. Drop a Spatial file anywhere to open it.</p>
			<output id="status" aria-live="polite" hidden></output>
		</div>
	</details>
	<div id="drop-target" class="drop-target" hidden>Drop Spatial to open</div>
	<script type="module">
		import '../src/index.js';

		// ------------------------------------------- //

		const photo = document.querySelector('#photo');
		const fileInput = document.querySelector('#file');
		const status = document.querySelector('#status');
		const dropTarget = document.querySelector('#drop-target');
		let dragDepth = 0;

		photo.addEventListener('load', () => { status.hidden = true; });
		photo.addEventListener('error', event => {
			status.textContent = event.detail.message;
			status.hidden = false;
		});

		//open files from the picker or a drop:
		//---------------
		function openPhoto(file)
		{
			if(!/\.spatial$/i.test(file.name))
			{
				status.textContent = 'Choose a .spatial file.';
				status.hidden = false;
				return;
			}

			status.hidden = true;
			photo.load(file).catch(() => {});
		}

		document.querySelector('#open').addEventListener('click', () => fileInput.click());
		fileInput.addEventListener('change', () => {
			const file = fileInput.files[0];
			if(file)
				openPhoto(file);
			fileInput.value = '';
		});

		//adjust framing + camera feel:
		//---------------
		document.querySelector('#cover').addEventListener('change', event => {
			photo.fit = event.target.checked ? 'cover' : 'contain';
		});
		document.querySelector('#sensitivity').addEventListener('input', event => {
			photo.sensitivity = Number(event.target.value);
			document.querySelector('#sensitivity-value').textContent = photo.sensitivity.toFixed(3);
		});
		document.querySelector('#snappiness').addEventListener('input', event => {
			photo.snappiness = Number(event.target.value);
			document.querySelector('#snappiness-value').textContent = photo.snappiness.toFixed(1);
		});

		//accept file drops across the whole page:
		//---------------
		document.addEventListener('dragenter', event => {
			if(!event.dataTransfer.types.includes('Files'))
				return;
			event.preventDefault();
			dragDepth++;
			dropTarget.hidden = false;
		});
		document.addEventListener('dragover', event => {
			if(!event.dataTransfer.types.includes('Files'))
				return;
			event.preventDefault();
			event.dataTransfer.dropEffect = 'copy';
		});
		document.addEventListener('dragleave', () => {
			dragDepth = Math.max(0, dragDepth - 1);
			dropTarget.hidden = dragDepth === 0;
		});
		document.addEventListener('drop', event => {
			if(!event.dataTransfer.types.includes('Files'))
				return;
			event.preventDefault();
			dragDepth = 0;
			dropTarget.hidden = true;
			const file = Array.from(event.dataTransfer.files).find(file => /\.spatial$/i.test(file.name));
			if(file)
				openPhoto(file);
			else
			{
				status.textContent = 'Drop a .spatial file.';
				status.hidden = false;
			}
		});

		photo.src = './demo.spatial';
	</script>
</body>
</html>
